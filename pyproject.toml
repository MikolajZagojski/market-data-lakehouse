[project]
name = "market-data-lakehouse"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Mikołaj Zagojski", email = "mikolajzagojski@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "databricks-sdk>=0.167.0",
    "pandas>=3.1.1",
    "requests>=2.34.2",
]

[project.scripts]
market-data-lakehouse = "market_data_lakehouse:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
